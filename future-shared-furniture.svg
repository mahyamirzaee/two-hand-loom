<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-labelledby="t d">
  <title id="t">TACT: two benches sharing one woven end (speculative concept)</title>
  <desc id="d">Front view and plan view of two mirrored waiting-room benches with soft seats and bent-wood frames. Their wooden ends meet in the middle and form one small shared table, covered with a woven, touch-sensitive surface: area A on one bench, area B on the other. A screen in the middle shows the digital weaving while both areas are touched at the same time. A speculative concept, not built or tested.</desc>

  <defs>
    <pattern id="weave" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="16" fill="#fbfaf8"/>
      <line x1="3" y1="0" x2="3" y2="16" stroke="#26307f" stroke-width="1.1" opacity="0.5"/>
      <line x1="9" y1="0" x2="9" y2="16" stroke="#26307f" stroke-width="1.1" opacity="0.5"/>
      <rect x="0" y="1.5" width="12" height="5" rx="2.5" fill="#b3add8"/>
      <rect x="0" y="9.5" width="12" height="5" rx="2.5" fill="#c3bee2"/>
      <rect x="2.2" y="0.5" width="1.6" height="7" rx="0.8" fill="#26307f"/>
      <rect x="8.2" y="8.5" width="1.6" height="7" rx="0.8" fill="#26307f"/>
    </pattern>
    <pattern id="screenweave" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="12" fill="#fbfaf8"/>
      <rect x="0" y="1" width="8" height="4" rx="2" fill="#b3add8"/>
      <rect x="0" y="7" width="8" height="4" rx="2" fill="#a9a2d6"/>
      <rect x="1.5" y="0" width="1.2" height="6" fill="#26307f"/>
      <rect x="5.5" y="6" width="1.2" height="6" fill="#26307f"/>
    </pattern>
    <style>
      .h { font-family: Literata, Georgia, serif; fill: #26307f; }
      .t { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; }
      .s { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; opacity: 0.72; }
      .n { font-family: Literata, Georgia, serif; fill: #fbfaf8; font-weight: 600; }
      .wood { fill: #dcc199; stroke: #8a6a45; stroke-width: 1.6; stroke-linejoin: round; }
      .cushion { fill: #f1eee8; stroke: #9b958a; stroke-width: 1.4; }
      .lead { fill: none; stroke: #26307f; stroke-width: 1; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#fbfaf8"/>

  <!-- Header -->
  <text class="h" x="60" y="66" font-size="32" font-weight="500">From screen to shared furniture</text>
  <text class="s" x="60" y="96" font-size="16">Two waiting-room benches whose wooden ends meet as one small shared table. Front view and plan, not to scale.</text>
  <rect x="1030" y="40" width="310" height="60" rx="8" fill="none" stroke="#26307f" stroke-width="1.5"/>
  <text class="h" x="1185" y="65" font-size="15" text-anchor="middle" font-weight="600">SPECULATIVE CONCEPT</text>
  <text class="s" x="1185" y="86" font-size="13" text-anchor="middle">Future research direction · not built or tested</text>

  <!-- ===== Front view ===== -->
  <line x1="80" y1="620" x2="1320" y2="620" stroke="#141418" stroke-width="1.2" opacity="0.4"/>

  <!-- Bench A (left): seat on the left, wooden end on the right -->
  <g>
    <!-- slanted outer leg -->
    <path class="wood" d="M196 452 L252 452 L224 620 L160 620 Z"/>
    <!-- slanted inner leg under the wooden end -->
    <path class="wood" d="M590 432 L640 432 L672 620 L616 620 Z"/>
    <!-- shelf -->
    <rect class="wood" x="214" y="540" width="404" height="12" rx="5"/>
    <!-- seat board -->
    <rect class="wood" x="180" y="440" width="410" height="14" rx="6"/>
    <!-- soft seat -->
    <rect class="cushion" x="184" y="410" width="396" height="32" rx="14"/>
    <!-- wooden end, slightly higher: half of the shared table -->
    <path class="wood" d="M570 392 H690 Q700 392 700 402 V432 H582 Q560 432 560 412 Q560 392 570 392 Z"/>
  </g>

  <!-- Bench B (right): mirrored -->
  <g>
    <path class="wood" d="M1204 452 L1148 452 L1176 620 L1240 620 Z"/>
    <path class="wood" d="M810 432 L760 432 L728 620 L784 620 Z"/>
    <rect class="wood" x="782" y="540" width="404" height="12" rx="5"/>
    <rect class="wood" x="810" y="440" width="410" height="14" rx="6"/>
    <rect class="cushion" x="820" y="410" width="396" height="32" rx="14"/>
    <path class="wood" d="M830 392 H710 Q700 392 700 402 V432 H818 Q840 432 840 412 Q840 392 830 392 Z"/>
  </g>

  <!-- woven, touch-sensitive surface over the shared ends -->
  <rect x="566" y="380" width="268" height="16" rx="8" fill="url(#weave)" stroke="#26307f" stroke-width="1"/>
  <!-- screen in the middle -->
  <rect x="652" y="296" width="96" height="74" rx="7" fill="#141418"/>
  <rect x="658" y="302" width="84" height="62" rx="3" fill="url(#screenweave)"/>
  <rect x="696" y="370" width="8" height="12" fill="#141418"/>
  <!-- where hands may rest -->
  <g fill="none" stroke="#141418" stroke-width="1.5" stroke-dasharray="5 4">
    <ellipse cx="604" cy="380" rx="32" ry="15"/>
    <ellipse cx="796" cy="380" rx="32" ry="15"/>
  </g>
  <text class="t" x="604" y="356" font-size="15" text-anchor="middle" font-weight="600">A</text>
  <text class="t" x="796" y="356" font-size="15" text-anchor="middle" font-weight="600">B</text>
  <!-- module under the shared ends -->
  <rect x="674" y="470" width="52" height="28" rx="4" fill="#1f2a6e"/>
  <path d="M604 432 C610 452, 650 470, 674 480" fill="none" stroke="#141418" stroke-width="1.5"/>
  <path d="M796 432 C790 452, 750 470, 726 480" fill="none" stroke="#141418" stroke-width="1.5"/>
  <path d="M700 470 L700 384" fill="none" stroke="#141418" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Labels, front view -->
  <g>
    <circle cx="380" cy="372" r="14" fill="#26307f"/><text class="n" x="380" y="378" font-size="15" text-anchor="middle">1</text>
    <text class="t" x="80" y="150" font-size="16" font-weight="600">Two benches, mirrored</text>
    <text class="s" x="80" y="170" font-size="13">soft seats on bent-wood frames, placed end to end</text>
    <text class="s" x="80" y="188" font-size="13">like ordinary waiting-room seating</text>
    <path class="lead" d="M380 358 L380 196 L250 196"/>

    <circle cx="700" cy="262" r="14" fill="#26307f"/><text class="n" x="700" y="268" font-size="15" text-anchor="middle">2</text>
    <text class="t" x="560" y="150" font-size="16" font-weight="600">Their wooden ends meet</text>
    <text class="s" x="560" y="170" font-size="13">and form one small shared table between</text>
    <text class="s" x="560" y="188" font-size="13">two people, with a screen in the middle</text>
    <path class="lead" d="M700 248 L700 196"/>

    <circle cx="900" cy="350" r="14" fill="#26307f"/><text class="n" x="900" y="356" font-size="15" text-anchor="middle">3</text>
    <text class="t" x="1000" y="150" font-size="16" font-weight="600">Woven, touch-sensitive surface</text>
    <text class="s" x="1000" y="170" font-size="13">A on one bench, B on the other: a hand</text>
    <text class="s" x="1000" y="188" font-size="13">can rest there without reaching across</text>
    <path class="lead" d="M886 356 L830 376"/>
    <path class="lead" d="M900 336 L1000 196"/>

    <circle cx="790" cy="270" r="14" fill="#26307f"/><text class="n" x="790" y="276" font-size="15" text-anchor="middle">4</text>
    <text class="s" x="812" y="262" font-size="13">screen shows the weaving only</text>
    <text class="s" x="812" y="280" font-size="13">while A and B are touched together</text>
    <path class="lead" d="M776 276 L750 300"/>

    <circle cx="760" cy="512" r="14" fill="#26307f"/><text class="n" x="760" y="518" font-size="15" text-anchor="middle">5</text>
    <path class="lead" d="M746 506 L726 492"/>
  </g>

  <!-- ===== Plan view ===== -->
  <text class="t" x="80" y="668" font-size="14" font-weight="600">Plan view</text>
  <rect x="180" y="690" width="400" height="76" rx="14" fill="#f1eee8" stroke="#9b958a" stroke-width="1.4"/>
  <rect x="820" y="690" width="400" height="76" rx="14" fill="#f1eee8" stroke="#9b958a" stroke-width="1.4"/>
  <rect x="560" y="690" width="280" height="76" rx="12" fill="url(#weave)" stroke="#26307f" stroke-width="1"/>
  <rect x="660" y="708" width="80" height="40" rx="4" fill="#141418"/>
  <rect x="665" y="713" width="70" height="30" rx="2" fill="url(#screenweave)"/>
  <rect x="570" y="696" width="68" height="64" rx="10" fill="#b3add8" opacity="0.55"/>
  <rect x="762" y="696" width="68" height="64" rx="10" fill="#b3add8" opacity="0.55"/>
  <text class="t" x="604" y="733" font-size="13" text-anchor="middle" font-weight="600">A</text>
  <text class="t" x="796" y="733" font-size="13" text-anchor="middle" font-weight="600">B</text>
  <g fill="none" stroke="#141418" stroke-width="1.4" stroke-dasharray="4 3">
    <circle cx="500" cy="728" r="22"/><path d="M522 732 Q550 730 578 730"/>
    <circle cx="900" cy="728" r="22"/><path d="M878 732 Q850 730 822 730"/>
  </g>
  <text class="s" x="500" y="796" font-size="12" text-anchor="middle">person sitting</text>
  <text class="s" x="900" y="796" font-size="12" text-anchor="middle">person sitting</text>
  <text class="s" x="1320" y="812" font-size="12" text-anchor="end">5 · inside the shared ends: conductive yarn as sensors, a small microcontroller, the screen; optional subtle warmth</text>

  <!-- ===== Open questions ===== -->
  <line x1="60" y1="834" x2="1340" y2="834" stroke="#26307f" stroke-width="1" opacity="0.35"/>
  <text class="h" x="60" y="866" font-size="19" font-weight="500">Open questions for this direction</text>
  <g class="s" font-size="13.5">
    <text x="60" y="894">· Invitation or pressure? A shared surface in a waiting room must never feel like a test or an obligation.</text>
    <text x="60" y="916">· Comfort and consent: touch near a stranger is not neutral, especially while waiting anxiously.</text>
    <text x="60" y="938">· Context: in places like immigration offices, any sensing technology may feel like surveillance.</text>
    <text x="720" y="894">· Sensing: telling a resting hand from a bag or a sleeve, and two people from one.</text>
    <text x="720" y="916">· Access: seat height, space for wheelchair users, people who cannot or do not want to touch.</text>
    <text x="720" y="938">· Material: hygiene, durability, safe low-voltage warmth.</text>
  </g>
</svg>
