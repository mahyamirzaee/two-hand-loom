<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" width="1400" height="1040" role="img" aria-labelledby="t d">
  <title id="t">From screen to shared furniture: a speculative seating concept for TACT</title>
  <desc id="d">Front view and top view of two adjacent seats whose inner ends meet as a small shared table. A soft, continuous, touch-sensitive textile covers the shared table and is the centre of the drawing. A small nearby screen and a small embedded module are shown in the background. Future design direction; a speculative proposal, not yet built or tested.</desc>

  <defs>
    <!-- a larger, softer weave for the shared textile: the visual centre -->
    <pattern id="cloth" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect width="16" height="20" fill="#f4f2fa"/>
      <line x1="4" y1="0" x2="4" y2="20" stroke="#26307f" stroke-width="1.3" opacity="0.45"/>
      <line x1="12" y1="0" x2="12" y2="20" stroke="#26307f" stroke-width="1.3" opacity="0.45"/>
      <rect x="0" y="1.5" width="16" height="7" rx="3.5" fill="#b3add8"/>
      <rect x="0" y="11.5" width="16" height="7" rx="3.5" fill="#c6c1e4"/>
      <rect x="3" y="0.5" width="2.2" height="9" rx="1.1" fill="#26307f" opacity="0.9"/>
      <rect x="11" y="10.5" width="2.2" height="9" rx="1.1" fill="#26307f" opacity="0.9"/>
    </pattern>
    <pattern id="screenweave" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="12" fill="#fbfaf8"/>
      <rect x="0" y="1" width="8" height="4" rx="2" fill="#b3add8"/>
      <rect x="0" y="7" width="8" height="4" rx="2" fill="#a9a2d6"/>
      <rect x="1.5" y="0" width="1.2" height="6" fill="#26307f"/>
      <rect x="5.5" y="6" width="1.2" height="6" fill="#26307f"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b3add8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b3add8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h  { font-family: Literata, Georgia, serif; fill: #26307f; }
      .hi { font-family: Literata, Georgia, serif; font-style: italic; fill: #55555f; }
      .t  { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; }
      .s  { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; opacity: 0.72; }
      .n  { font-family: Literata, Georgia, serif; fill: #fbfaf8; font-weight: 600; }
      .wood { fill: #e2cba7; stroke: #9a7b55; stroke-width: 1.4; stroke-linejoin: round; }
      .cushion { fill: #f1eee8; stroke: #a8a296; stroke-width: 1.3; }
      .quiet { opacity: 0.55; }
      .lead { fill: none; stroke: #26307f; stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.8; }
    </style>
  </defs>

  <rect width="1400" height="1040" fill="#fbfaf8"/>

  <!-- Header -->
  <text class="h" x="70" y="72" font-size="34" font-weight="500">From screen to shared furniture</text>
  <text class="hi" x="70" y="104" font-size="17">A speculative seating concept for shared interaction in public waiting spaces.</text>

  <!-- ===== Front view ===== -->
  <line x1="100" y1="580" x2="1300" y2="580" stroke="#141418" stroke-width="1.1" opacity="0.3"/>

  <!-- Seat A -->
  <g>
    <path class="wood" d="M206 452 L258 452 L232 580 L172 580 Z"/>
    <path class="wood" d="M560 432 L604 432 L632 580 L582 580 Z"/>
    <rect class="wood" x="222" y="530" width="372" height="11" rx="5"/>
    <rect class="wood" x="190" y="440" width="390" height="13" rx="6"/>
    <rect class="cushion" x="194" y="412" width="376" height="30" rx="14"/>
    <path class="wood" d="M546 396 H700 V432 H560 Q536 432 536 414 Q536 396 546 396 Z"/>
  </g>
  <!-- Seat B (mirrored) -->
  <g>
    <path class="wood" d="M1194 452 L1142 452 L1168 580 L1228 580 Z"/>
    <path class="wood" d="M840 432 L796 432 L768 580 L818 580 Z"/>
    <rect class="wood" x="806" y="530" width="372" height="11" rx="5"/>
    <rect class="wood" x="820" y="440" width="390" height="13" rx="6"/>
    <rect class="cushion" x="830" y="412" width="376" height="30" rx="14"/>
    <path class="wood" d="M854 396 H700 V432 H840 Q864 432 864 414 Q864 396 854 396 Z"/>
  </g>

  <!-- THE SHARED TEXTILE: the centre of the drawing -->
  <ellipse cx="700" cy="384" rx="230" ry="58" fill="url(#halo)"/>
  <path d="M528 372 Q528 362 540 362 H860 Q872 362 872 372 V392 Q872 404 864 410 Q860 426 852 434 L848 434 Q850 420 846 406 H554 Q550 420 552 434 L548 434 Q540 426 536 410 Q528 404 528 392 Z"
        fill="url(#cloth)" stroke="#26307f" stroke-width="1.2"/>
  <!-- a soft top edge, like cloth -->
  <path d="M540 363 Q620 356 700 363 T860 363" fill="none" stroke="#fbfaf8" stroke-width="2" opacity="0.8"/>
  <!-- fringe -->
  <g stroke="#26307f" stroke-width="1" opacity="0.55">
    <line x1="549" y1="434" x2="548" y2="450"/><line x1="553" y1="434" x2="554" y2="448"/>
    <line x1="847" y1="434" x2="846" y2="448"/><line x1="851" y1="434" x2="852" y2="450"/>
  </g>
  <!-- two hands resting -->
  <g fill="none" stroke="#141418" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.7">
    <ellipse cx="610" cy="370" rx="36" ry="16"/>
    <ellipse cx="790" cy="370" rx="36" ry="16"/>
  </g>

  <!-- secondary technology: small, quiet -->
  <g class="quiet">
    <rect x="682" y="474" width="36" height="20" rx="3" fill="#55555f"/>
    <path d="M700 474 L700 434" fill="none" stroke="#55555f" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M718 486 C900 500, 1160 470, 1268 330" fill="none" stroke="#55555f" stroke-width="1.2" stroke-dasharray="3 4"/>
    <rect x="1236" y="262" width="74" height="58" rx="6" fill="#3d3f47"/>
    <rect x="1241" y="267" width="64" height="48" rx="3" fill="url(#screenweave)"/>
    <line x1="1273" y1="320" x2="1273" y2="580" stroke="#3d3f47" stroke-width="3"/>
    <line x1="1248" y1="580" x2="1298" y2="580" stroke="#3d3f47" stroke-width="3"/>
  </g>

  <!-- Numbered markers -->
  <g>
    <circle cx="382" cy="384" r="14" fill="#26307f"/><text class="n" x="382" y="390" font-size="14" text-anchor="middle">1</text>
    <circle cx="1018" cy="384" r="14" fill="#26307f"/><text class="n" x="1018" y="390" font-size="14" text-anchor="middle">1</text>

    <circle cx="700" cy="470" r="0"/>
    <circle cx="620" cy="460" r="14" fill="#26307f"/><text class="n" x="620" y="466" font-size="14" text-anchor="middle">2</text>
    <path class="lead" d="M628 448 L648 430"/>

    <circle cx="700" cy="306" r="14" fill="#26307f"/><text class="n" x="700" y="312" font-size="14" text-anchor="middle">3</text>
    <path class="lead" d="M700 320 L700 360"/>

    <circle cx="1210" cy="246" r="14" fill="#26307f"/><text class="n" x="1210" y="252" font-size="14" text-anchor="middle">4</text>

    <circle cx="748" cy="500" r="14" fill="#26307f"/><text class="n" x="748" y="506" font-size="14" text-anchor="middle">5</text>
    <path class="lead" d="M734 496 L720 488"/>
  </g>

  <!-- ===== Top view ===== -->
  <text class="t" x="100" y="640" font-size="13" font-weight="600" opacity="0.7">Top view</text>
  <rect x="194" y="660" width="376" height="74" rx="16" fill="#f1eee8" stroke="#a8a296" stroke-width="1.3"/>
  <rect x="830" y="660" width="376" height="74" rx="16" fill="#f1eee8" stroke="#a8a296" stroke-width="1.3"/>
  <ellipse cx="700" cy="697" rx="190" ry="56" fill="url(#halo)"/>
  <rect x="540" y="654" width="320" height="86" rx="14" fill="url(#cloth)" stroke="#26307f" stroke-width="1.2"/>
  <text class="t" x="382" y="702" font-size="15" text-anchor="middle" font-weight="600">Seat A</text>
  <text class="t" x="1018" y="702" font-size="15" text-anchor="middle" font-weight="600">Seat B</text>
  <g class="quiet">
    <rect x="1236" y="672" width="74" height="50" rx="5" fill="#3d3f47"/>
    <rect x="1241" y="677" width="64" height="40" rx="2" fill="url(#screenweave)"/>
  </g>

  <!-- ===== Legend: five labels ===== -->
  <line x1="70" y1="780" x2="1330" y2="780" stroke="#26307f" stroke-width="1" opacity="0.25"/>
  <g>
    <circle cx="84" cy="814" r="11" fill="#26307f"/><text class="n" x="84" y="819" font-size="12" text-anchor="middle">1</text>
    <text class="t" x="104" y="810" font-size="15" font-weight="600">Two adjacent seats</text>
    <text class="s" x="104" y="830" font-size="13.5">Two seating positions are arranged around a shared centre.</text>

    <circle cx="84" cy="864" r="11" fill="#26307f"/><text class="n" x="84" y="869" font-size="12" text-anchor="middle">2</text>
    <text class="t" x="104" y="860" font-size="15" font-weight="600">A shared table</text>
    <text class="s" x="104" y="880" font-size="13.5">The inner ends of the seats meet to form a small table between them.</text>

    <circle cx="84" cy="914" r="11" fill="#26307f"/><text class="n" x="84" y="919" font-size="12" text-anchor="middle">3</text>
    <text class="t" x="104" y="910" font-size="15" font-weight="600">A soft textile surface</text>
    <text class="s" x="104" y="930" font-size="13.5">A continuous, touch-sensitive textile covers the shared surface, inviting exploration through touch.</text>

    <circle cx="764" cy="814" r="11" fill="#26307f"/><text class="n" x="764" y="819" font-size="12" text-anchor="middle">4</text>
    <text class="t" x="784" y="810" font-size="15" font-weight="600">Digital weaving</text>
    <text class="s" x="784" y="830" font-size="13.5">A nearby screen visualises the weaving when two touch points are active simultaneously.</text>

    <circle cx="764" cy="864" r="11" fill="#26307f"/><text class="n" x="764" y="869" font-size="12" text-anchor="middle">5</text>
    <text class="t" x="784" y="860" font-size="15" font-weight="600">Embedded technology</text>
    <text class="s" x="784" y="880" font-size="13.5">Touch sensors and a microcontroller connect the textile surface to the digital display.</text>
  </g>

  <!-- ===== Design intention ===== -->
  <text class="t" x="764" y="912" font-size="13" font-weight="600" opacity="0.7">Design intention</text>
  <text class="h" x="764" y="938" font-size="17" font-style="italic">Could a shared textile surface make room for voluntary, non-verbal</text>
  <text class="h" x="764" y="962" font-size="17" font-style="italic">interaction without requiring conversation or social engagement?</text>

  <text class="hi" x="70" y="1010" font-size="14">Future design direction. Speculative proposal, not yet built or tested.</text>
</svg>
