<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="t d">
  <title id="t">The Loom That Waits: from screen to shared furniture (speculative concept)</title>
  <desc id="d">Front view of two adjacent seats joined by a small table. A continuous woven textile runs over both inner armrests and the table, so two people's hands can rest on the same material. Sensors in the textile connect to a small module under the table, which sends two touch states to a nearby tablet showing the digital weaving. A speculative concept, not built or tested.</desc>

  <defs>
    <pattern id="weave" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="16" fill="#fbfaf8"/>
      <line x1="3" y1="0" x2="3" y2="16" stroke="#26307f" stroke-width="1.1" opacity="0.5"/>
      <line x1="9" y1="0" x2="9" y2="16" stroke="#26307f" stroke-width="1.1" opacity="0.5"/>
      <rect x="0" y="1.5" width="12" height="5" rx="2.5" fill="#b3add8"/>
      <rect x="0" y="9.5" width="12" height="5" rx="2.5" fill="#c3bee2"/>
      <rect x="2.2" y="0.5" width="1.6" height="7" rx="0.8" fill="#26307f"/>
      <rect x="8.2" y="8.5" width="1.6" height="7" rx="0.8" fill="#26307f"/>
    </pattern>
    <pattern id="screenweave" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="12" fill="#fbfaf8"/>
      <rect x="0" y="1" width="8" height="4" rx="2" fill="#b3add8"/>
      <rect x="0" y="7" width="8" height="4" rx="2" fill="#a9a2d6"/>
      <rect x="1.5" y="0" width="1.2" height="6" fill="#26307f"/>
      <rect x="5.5" y="6" width="1.2" height="6" fill="#26307f"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#26307f"/>
    </marker>
    <style>
      .h { font-family: Literata, Georgia, serif; fill: #26307f; }
      .t { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; }
      .s { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; opacity: 0.72; }
      .n { font-family: Literata, Georgia, serif; fill: #fbfaf8; font-weight: 600; }
      .wood { fill: #ece3d4; stroke: #6b5a45; stroke-width: 1.6; }
      .lead { fill: none; stroke: #26307f; stroke-width: 1; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#fbfaf8"/>

  <!-- Header -->
  <text class="h" x="60" y="68" font-size="32" font-weight="500">From screen to shared furniture</text>
  <text class="s" x="60" y="98" font-size="16">A possible physical iteration of The Loom That Waits, e.g. for a public waiting room. Front view, not to scale.</text>
  <rect x="1030" y="42" width="310" height="60" rx="8" fill="none" stroke="#26307f" stroke-width="1.5"/>
  <text class="h" x="1185" y="67" font-size="15" text-anchor="middle" font-weight="600">SPECULATIVE CONCEPT</text>
  <text class="s" x="1185" y="88" font-size="13" text-anchor="middle">Future research direction · not built or tested</text>

  <!-- floor -->
  <line x1="80" y1="640" x2="960" y2="640" stroke="#141418" stroke-width="1.2" opacity="0.4"/>

  <!-- Seat A -->
  <g>
    <rect class="wood" x="150" y="250" width="230" height="215" rx="10"/>
    <rect class="wood" x="130" y="465" width="290" height="42" rx="8"/>
    <rect class="wood" x="120" y="400" width="26" height="107" rx="6"/>
    <line x1="150" y1="507" x2="150" y2="640" stroke="#6b5a45" stroke-width="4"/>
    <line x1="400" y1="507" x2="400" y2="640" stroke="#6b5a45" stroke-width="4"/>
  </g>
  <!-- Seat B -->
  <g>
    <rect class="wood" x="680" y="250" width="230" height="215" rx="10"/>
    <rect class="wood" x="640" y="465" width="290" height="42" rx="8"/>
    <rect class="wood" x="914" y="400" width="26" height="107" rx="6"/>
    <line x1="660" y1="507" x2="660" y2="640" stroke="#6b5a45" stroke-width="4"/>
    <line x1="910" y1="507" x2="910" y2="640" stroke="#6b5a45" stroke-width="4"/>
  </g>
  <!-- Inner armrests -->
  <rect class="wood" x="412" y="404" width="28" height="103" rx="6"/>
  <rect class="wood" x="620" y="404" width="28" height="103" rx="6"/>
  <!-- Small table between -->
  <rect class="wood" x="448" y="440" width="164" height="16" rx="4"/>
  <line x1="530" y1="456" x2="530" y2="640" stroke="#6b5a45" stroke-width="5"/>
  <line x1="496" y1="640" x2="564" y2="640" stroke="#6b5a45" stroke-width="5"/>

  <!-- Continuous textile over both inner armrests and the table -->
  <path d="M404 404 H448 V436 H612 V404 H656 V424 H612 V456 H448 V424 H404 Z" fill="url(#weave)" stroke="#26307f" stroke-width="1"/>
  <!-- fringes (loose warp ends) -->
  <g stroke="#26307f" stroke-width="1" opacity="0.6">
    <line x1="407" y1="424" x2="407" y2="440"/><line x1="413" y1="424" x2="413" y2="442"/><line x1="419" y1="424" x2="419" y2="439"/>
    <line x1="641" y1="424" x2="641" y2="441"/><line x1="647" y1="424" x2="647" y2="439"/><line x1="653" y1="424" x2="653" y2="442"/>
  </g>
  <!-- touch zones (where hands might rest) -->
  <g fill="none" stroke="#141418" stroke-width="1.5" stroke-dasharray="5 4">
    <ellipse cx="452" cy="420" rx="34" ry="20"/>
    <ellipse cx="608" cy="420" rx="34" ry="20"/>
  </g>
  <text class="s" x="452" y="388" font-size="13" text-anchor="middle">hand A</text>
  <text class="s" x="608" y="388" font-size="13" text-anchor="middle">hand B</text>

  <!-- Sensor module under the table -->
  <rect x="496" y="520" width="68" height="40" rx="5" fill="#1f2a6e"/>
  <text x="530" y="545" font-family="'Atkinson Hyperlegible Next', Arial, sans-serif" font-size="11" fill="#fbfaf8" text-anchor="middle">module</text>
  <path d="M470 456 C470 490, 500 500, 510 520" fill="none" stroke="#141418" stroke-width="1.8"/>
  <path d="M590 456 C590 490, 560 500, 550 520" fill="none" stroke="#141418" stroke-width="1.8"/>

  <!-- Data link to tablet -->
  <path d="M564 540 C760 560, 900 520, 1040 470" fill="none" stroke="#26307f" stroke-width="2.2" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <text class="s" x="800" y="575" font-size="13" text-anchor="middle">two touch states only: A on/off, B on/off</text>

  <!-- Tablet on a stand -->
  <g>
    <rect x="1050" y="250" width="250" height="330" rx="20" fill="#141418"/>
    <rect x="1064" y="266" width="222" height="298" rx="8" fill="#fbfaf8"/>
    <rect x="1100" y="276" width="150" height="150" fill="url(#screenweave)"/>
    <rect x="1100" y="276" width="150" height="4" fill="#26307f" opacity="0.85"/>
    <g stroke="#26307f" stroke-width="1" opacity="0.5">
      <line x1="1102" y1="426" x2="1102" y2="552"/><line x1="1112" y1="426" x2="1112" y2="552"/><line x1="1122" y1="426" x2="1122" y2="552"/>
      <line x1="1132" y1="426" x2="1132" y2="552"/><line x1="1142" y1="426" x2="1142" y2="552"/><line x1="1152" y1="426" x2="1152" y2="552"/>
      <line x1="1162" y1="426" x2="1162" y2="552"/><line x1="1172" y1="426" x2="1172" y2="552"/><line x1="1182" y1="426" x2="1182" y2="552"/>
      <line x1="1192" y1="426" x2="1192" y2="552"/><line x1="1202" y1="426" x2="1202" y2="552"/><line x1="1212" y1="426" x2="1212" y2="552"/>
      <line x1="1222" y1="426" x2="1222" y2="552"/><line x1="1232" y1="426" x2="1232" y2="552"/><line x1="1242" y1="426" x2="1242" y2="552"/>
    </g>
    <line x1="1175" y1="580" x2="1175" y2="640" stroke="#141418" stroke-width="5"/>
    <line x1="1130" y1="640" x2="1220" y2="640" stroke="#141418" stroke-width="5"/>
  </g>

  <!-- Numbered labels -->
  <g>
    <circle cx="530" cy="170" r="14" fill="#26307f"/><text class="n" x="530" y="176" font-size="15" text-anchor="middle">1</text>
    <text class="t" x="552" y="166" font-size="16" font-weight="600">Shared textile surface</text>
    <text class="s" x="552" y="186" font-size="13">one continuous woven band over both inner armrests and the table,</text>
    <text class="s" x="552" y="204" font-size="13">with touch-sensitive (conductive) yarn where hands may rest</text>
    <path class="lead" d="M530 184 L530 400"/>

    <circle cx="265" cy="170" r="14" fill="#26307f"/><text class="n" x="265" y="176" font-size="15" text-anchor="middle">2</text>
    <text class="t" x="150" y="214" font-size="16" font-weight="600">Two seats, one small table</text>
    <text class="s" x="150" y="234" font-size="13">hands can rest on the shared material</text>
    <text class="s" x="150" y="234" font-size="13" dy="18">without deliberately reaching towards each other</text>

    <circle cx="470" cy="600" r="14" fill="#26307f"/><text class="n" x="470" y="606" font-size="15" text-anchor="middle">3</text>
    <text class="t" x="190" y="682" font-size="16" font-weight="600">Sensor module under the table</text>
    <text class="s" x="190" y="702" font-size="13">reads the two touch areas; sends only whether each is touched</text>
    <path class="lead" d="M470 614 L470 670 L190 670"/>

    <circle cx="1175" cy="226" r="14" fill="#26307f"/><text class="n" x="1175" y="232" font-size="15" text-anchor="middle">4</text>
    <text class="t" x="1175" y="672" font-size="16" font-weight="600" text-anchor="middle">Nearby tablet</text>
    <text class="s" x="1175" y="692" font-size="13" text-anchor="middle">shows the digital weaving</text>
    <text class="s" x="1175" y="710" font-size="13" text-anchor="middle">(the existing prototype)</text>

    <circle cx="700" cy="682" r="14" fill="#26307f"/><text class="n" x="700" y="688" font-size="15" text-anchor="middle">5</text>
    <text class="t" x="722" y="682" font-size="16" font-weight="600">Optional: subtle warmth</text>
    <text class="s" x="722" y="702" font-size="13">a gently warm textile as an additional</text>
    <text class="s" x="722" y="720" font-size="13">tactile quality (to be explored)</text>
  </g>

  <!-- Open questions -->
  <line x1="60" y1="760" x2="1340" y2="760" stroke="#26307f" stroke-width="1" opacity="0.35"/>
  <text class="h" x="60" y="792" font-size="19" font-weight="500">Open questions for this direction</text>
  <g class="s" font-size="13.5">
    <text x="60" y="820">· Incidental or intentional? Can the surface invite touch without making anyone feel watched or obliged?</text>
    <text x="60" y="842">· Comfort and consent: touch near a stranger is not neutral, especially in a stressful waiting room.</text>
    <text x="60" y="864">· Sensing: how to tell a resting hand from a bag or sleeve, and two people from one?</text>
    <text x="720" y="820">· Context: in places like immigration offices, any sensing technology may feel like surveillance.</text>
    <text x="720" y="842">· Access: seat height, wheelchair users, people who cannot or do not want to touch.</text>
    <text x="720" y="864">· Material: hygiene, durability, safe low-voltage warmth.</text>
  </g>
</svg>
