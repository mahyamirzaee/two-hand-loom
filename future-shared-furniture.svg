<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-labelledby="t d">
  <title id="t">The Loom That Waits: a loom module in a row of waiting-room chairs (speculative concept)</title>
  <desc id="d">Front view and plan view of a row of standard waiting-room chairs. One seat in the row is replaced by a low, soft module with bent-wood sides. Its woven top is touch-sensitive at both ends, beside the two neighbouring chairs, and a screen in the middle shows the digital weaving when both neighbours rest a hand on it at the same time. A speculative concept, not built or tested.</desc>

  <defs>
    <pattern id="weave" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="16" fill="#fbfaf8"/>
      <line x1="3" y1="0" x2="3" y2="16" stroke="#26307f" stroke-width="1.1" opacity="0.5"/>
      <line x1="9" y1="0" x2="9" y2="16" stroke="#26307f" stroke-width="1.1" opacity="0.5"/>
      <rect x="0" y="1.5" width="12" height="5" rx="2.5" fill="#b3add8"/>
      <rect x="0" y="9.5" width="12" height="5" rx="2.5" fill="#c3bee2"/>
      <rect x="2.2" y="0.5" width="1.6" height="7" rx="0.8" fill="#26307f"/>
      <rect x="8.2" y="8.5" width="1.6" height="7" rx="0.8" fill="#26307f"/>
    </pattern>
    <pattern id="screenweave" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="12" fill="#fbfaf8"/>
      <rect x="0" y="1" width="8" height="4" rx="2" fill="#b3add8"/>
      <rect x="0" y="7" width="8" height="4" rx="2" fill="#a9a2d6"/>
      <rect x="1.5" y="0" width="1.2" height="6" fill="#26307f"/>
      <rect x="5.5" y="6" width="1.2" height="6" fill="#26307f"/>
    </pattern>
    <!-- one standard waiting-room chair, front view, centred on x=0 -->
    <g id="chair">
      <rect x="-62" y="300" width="124" height="118" rx="12" fill="#43464f"/>
      <line x1="-50" y1="418" x2="-50" y2="430" stroke="#a3a8b0" stroke-width="5"/>
      <line x1="50" y1="418" x2="50" y2="430" stroke="#a3a8b0" stroke-width="5"/>
      <rect x="-72" y="428" width="144" height="24" rx="9" fill="#3a3d45"/>
      <line x1="-58" y1="452" x2="-66" y2="600" stroke="#a3a8b0" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="58" y1="452" x2="66" y2="600" stroke="#a3a8b0" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <style>
      .h { font-family: Literata, Georgia, serif; fill: #26307f; }
      .t { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; }
      .s { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; opacity: 0.72; }
      .n { font-family: Literata, Georgia, serif; fill: #fbfaf8; font-weight: 600; }
      .wood { fill: #dcc199; stroke: #8a6a45; stroke-width: 1.6; }
      .lead { fill: none; stroke: #26307f; stroke-width: 1; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#fbfaf8"/>

  <!-- Header -->
  <text class="h" x="60" y="66" font-size="32" font-weight="500">From screen to shared furniture</text>
  <text class="s" x="60" y="96" font-size="16">In an existing row of waiting-room chairs, one seat is replaced by a low loom module. Front view and plan, not to scale.</text>
  <rect x="1030" y="40" width="310" height="60" rx="8" fill="none" stroke="#26307f" stroke-width="1.5"/>
  <text class="h" x="1185" y="65" font-size="15" text-anchor="middle" font-weight="600">SPECULATIVE CONCEPT</text>
  <text class="s" x="1185" y="86" font-size="13" text-anchor="middle">Future research direction · not built or tested</text>

  <!-- ===== Front view ===== -->
  <line x1="60" y1="600" x2="1340" y2="600" stroke="#141418" stroke-width="1.2" opacity="0.4"/>
  <use href="#chair" x="170"/>
  <use href="#chair" x="405"/>
  <use href="#chair" x="875"/>
  <use href="#chair" x="1110"/>

  <!-- The loom module, in place of the third seat -->
  <g>
    <!-- bent-wood sides -->
    <path class="wood" d="M548 404 C548 450, 556 520, 582 600 L600 600 C578 520, 572 452, 572 404 Z"/>
    <path class="wood" d="M732 404 C732 450, 724 520, 698 600 L680 600 C702 520, 708 452, 708 404 Z"/>
    <!-- low shelf -->
    <rect class="wood" x="572" y="520" width="136" height="10" rx="4"/>
    <!-- soft woven top, touch-sensitive at both ends -->
    <rect x="536" y="388" width="208" height="22" rx="11" fill="url(#weave)" stroke="#26307f" stroke-width="1"/>
    <!-- screen in the middle -->
    <rect x="596" y="304" width="88" height="70" rx="7" fill="#141418"/>
    <rect x="602" y="310" width="76" height="58" rx="3" fill="url(#screenweave)"/>
    <rect x="636" y="374" width="8" height="14" fill="#141418"/>
    <!-- where hands may rest -->
    <g fill="none" stroke="#141418" stroke-width="1.5" stroke-dasharray="5 4">
      <ellipse cx="560" cy="386" rx="30" ry="15"/>
      <ellipse cx="720" cy="386" rx="30" ry="15"/>
    </g>
    <text class="t" x="560" y="362" font-size="15" text-anchor="middle" font-weight="600">A</text>
    <text class="t" x="720" y="362" font-size="15" text-anchor="middle" font-weight="600">B</text>
    <!-- sensors and module inside -->
    <rect x="612" y="476" width="56" height="30" rx="4" fill="#1f2a6e"/>
    <path d="M560 410 C566 440, 592 470, 612 486" fill="none" stroke="#141418" stroke-width="1.5"/>
    <path d="M720 410 C714 440, 688 470, 668 486" fill="none" stroke="#141418" stroke-width="1.5"/>
    <path d="M640 476 L640 388" fill="none" stroke="#141418" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Labels, front view -->
  <g>
    <circle cx="170" cy="262" r="14" fill="#26307f"/><text class="n" x="170" y="268" font-size="15" text-anchor="middle">1</text>
    <text class="t" x="80" y="150" font-size="16" font-weight="600">Existing waiting-room chairs</text>
    <text class="s" x="80" y="170" font-size="13">the row stays as it is; nothing about the chairs changes</text>
    <path class="lead" d="M170 176 L170 248"/>

    <circle cx="640" cy="262" r="14" fill="#26307f"/><text class="n" x="640" y="268" font-size="15" text-anchor="middle">2</text>
    <text class="t" x="520" y="150" font-size="16" font-weight="600">One seat becomes a loom module</text>
    <text class="s" x="520" y="170" font-size="13">a low, soft bench element with bent-wood sides,</text>
    <text class="s" x="520" y="188" font-size="13">placed at a random position in the row</text>
    <path class="lead" d="M640 194 L640 248"/>

    <circle cx="850" cy="360" r="14" fill="#26307f"/><text class="n" x="850" y="366" font-size="15" text-anchor="middle">3</text>
    <text class="t" x="1010" y="150" font-size="16" font-weight="600">Woven, touch-sensitive ends</text>
    <text class="s" x="1010" y="170" font-size="13">A beside one neighbour, B beside the other;</text>
    <text class="s" x="1010" y="188" font-size="13">a hand can rest there without reaching across</text>
    <path class="lead" d="M864 360 L752 384"/>
    <path class="lead" d="M850 346 L1000 196"/>

    <circle cx="720" cy="290" r="14" fill="#26307f"/><text class="n" x="720" y="296" font-size="15" text-anchor="middle">4</text>
    <text class="t" x="742" y="214" font-size="16" font-weight="600">Screen in the module</text>
    <text class="s" x="742" y="233" font-size="13">shows the digital weaving only</text>
    <text class="s" x="742" y="251" font-size="13">while A and B are touched together</text>
    <path class="lead" d="M706 296 L686 318"/>

    <circle cx="745" cy="490" r="14" fill="#26307f"/><text class="n" x="745" y="496" font-size="15" text-anchor="middle">5</text>
    <path class="lead" d="M731 490 L670 490"/>
  </g>

  <!-- ===== Plan view ===== -->
  <text class="t" x="60" y="652" font-size="14" font-weight="600">Plan view</text>
  <line x1="60" y1="770" x2="1340" y2="770" stroke="#141418" stroke-width="1" opacity="0.25"/>
  <g fill="#43464f">
    <rect x="135" y="690" width="70" height="66" rx="8"/><rect x="135" y="750" width="70" height="8" rx="3"/>
    <rect x="370" y="690" width="70" height="66" rx="8"/><rect x="370" y="750" width="70" height="8" rx="3"/>
    <rect x="840" y="690" width="70" height="66" rx="8"/><rect x="840" y="750" width="70" height="8" rx="3"/>
    <rect x="1075" y="690" width="70" height="66" rx="8"/><rect x="1075" y="750" width="70" height="8" rx="3"/>
  </g>
  <rect x="536" y="694" width="208" height="58" rx="12" fill="url(#weave)" stroke="#26307f" stroke-width="1"/>
  <rect x="604" y="704" width="72" height="38" rx="4" fill="#141418"/>
  <rect x="609" y="709" width="62" height="28" rx="2" fill="url(#screenweave)"/>
  <rect x="540" y="698" width="40" height="50" rx="9" fill="#b3add8" opacity="0.55"/>
  <rect x="700" y="698" width="40" height="50" rx="9" fill="#b3add8" opacity="0.55"/>
  <text class="t" x="560" y="728" font-size="13" text-anchor="middle" font-weight="600">A</text>
  <text class="t" x="720" y="728" font-size="13" text-anchor="middle" font-weight="600">B</text>
  <g fill="none" stroke="#141418" stroke-width="1.4" stroke-dasharray="4 3">
    <circle cx="405" cy="708" r="20"/><path d="M425 716 Q500 712 548 722"/>
    <circle cx="875" cy="708" r="20"/><path d="M855 716 Q780 712 732 722"/>
  </g>
  <text class="s" x="405" y="682" font-size="12" text-anchor="middle">neighbour</text>
  <text class="s" x="875" y="682" font-size="12" text-anchor="middle">neighbour</text>
  <text class="s" x="1340" y="790" font-size="12" text-anchor="end">5 · inside the module: conductive yarn as sensors, a small microcontroller, the screen; optional subtle warmth</text>

  <!-- ===== Open questions ===== -->
  <line x1="60" y1="820" x2="1340" y2="820" stroke="#26307f" stroke-width="1" opacity="0.35"/>
  <text class="h" x="60" y="852" font-size="19" font-weight="500">Open questions for this direction</text>
  <g class="s" font-size="13.5">
    <text x="60" y="880">· Invitation or pressure? A shared surface in a waiting room must never feel like a test or an obligation.</text>
    <text x="60" y="902">· Comfort and consent: touch near a stranger is not neutral, especially while waiting anxiously.</text>
    <text x="60" y="924">· Context: in places like immigration offices, any sensing technology may feel like surveillance.</text>
    <text x="720" y="880">· Capacity: replacing a seat removes a place to sit in crowded rooms.</text>
    <text x="720" y="902">· Sensing: telling a resting hand from a bag or a sleeve, and two people from one.</text>
    <text x="720" y="924">· Access and material: wheelchair users, hygiene, durability, safe low-voltage warmth.</text>
  </g>
</svg>
