<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-labelledby="t d">
  <title id="t">TACT: speculative physical version (concept diagram)</title>
  <desc id="d">A textile panel with touch sensors woven into its left and right edges, wired to a microcontroller, which sends data to a tablet that shows the evolving digital cloth. A speculative concept, not built or tested.</desc>

  <defs>
    <!-- plain weave: lilac weft, indigo warp lying on top every other crossing -->
    <pattern id="weave" width="16" height="24" patternUnits="userSpaceOnUse">
      <rect width="16" height="24" fill="#fbfaf8"/>
      <line x1="4" y1="0" x2="4" y2="24" stroke="#26307f" stroke-width="1.4" opacity="0.5"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#26307f" stroke-width="1.4" opacity="0.5"/>
      <rect x="0" y="2" width="16" height="8" rx="4" fill="#b3add8"/>
      <rect x="0" y="14" width="16" height="8" rx="4" fill="#c1bce0"/>
      <rect x="3" y="0.5" width="2.2" height="11" rx="1.1" fill="#26307f"/>
      <rect x="11" y="12.5" width="2.2" height="11" rx="1.1" fill="#26307f"/>
    </pattern>
    <!-- conductive yarn: a warm metallic stripe -->
    <pattern id="conductive" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e9dccb"/>
      <path d="M0 5 H10" stroke="#a8743f" stroke-width="2.2"/>
      <path d="M5 0 V10" stroke="#a8743f" stroke-width="1" opacity="0.6"/>
    </pattern>
    <pattern id="screenweave" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="12" fill="#fbfaf8"/>
      <rect x="0" y="1" width="8" height="4" rx="2" fill="#b3add8"/>
      <rect x="0" y="7" width="8" height="4" rx="2" fill="#a9a2d6"/>
      <rect x="1.5" y="0" width="1.2" height="6" fill="#26307f"/>
      <rect x="5.5" y="6" width="1.2" height="6" fill="#26307f"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#26307f"/>
    </marker>
    <style>
      .h  { font-family: Literata, Georgia, serif; fill: #26307f; }
      .t  { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; }
      .s  { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; fill: #141418; opacity: 0.72; }
      .n  { font-family: Literata, Georgia, serif; fill: #fbfaf8; font-weight: 600; }
      .wire { fill: none; stroke: #141418; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .lead { fill: none; stroke: #26307f; stroke-width: 1; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#fbfaf8"/>

  <!-- Header -->
  <text class="h" x="60" y="70" font-size="34" font-weight="500">TACT: a possible physical version</text>
  <text class="s" x="60" y="102" font-size="17">Conceptual system diagram for a future prototype. Components and connections are proposals for investigation.</text>
  <g>
    <rect x="1010" y="44" width="330" height="62" rx="8" fill="none" stroke="#26307f" stroke-width="1.5"/>
    <text class="h" x="1175" y="70" font-size="16" text-anchor="middle" font-weight="600">SPECULATIVE CONCEPT</text>
    <text class="s" x="1175" y="92" font-size="14" text-anchor="middle">Not built · not tested · not validated</text>
  </g>

  <!-- 1. Physical textile surface -->
  <g>
    <!-- loom frame (wood) -->
    <rect x="70" y="160" width="560" height="380" rx="6" fill="#efe7da" stroke="#6b5a45" stroke-width="2"/>
    <rect x="96" y="182" width="508" height="336" fill="url(#weave)"/>
    <!-- free warp below the cloth -->
    <g stroke="#26307f" stroke-width="1.4" opacity="0.55">
      <line x1="100" y1="480" x2="100" y2="518"/><line x1="116" y1="480" x2="116" y2="518"/>
    </g>
    <!-- sensor strips in the selvedges -->
    <rect x="96" y="182" width="48" height="336" fill="url(#conductive)" stroke="#a8743f" stroke-width="1.5"/>
    <rect x="556" y="182" width="48" height="336" fill="url(#conductive)" stroke="#a8743f" stroke-width="1.5"/>
    <!-- hands (outline only) -->
    <g fill="none" stroke="#141418" stroke-width="1.6" stroke-dasharray="5 4">
      <ellipse cx="120" cy="330" rx="40" ry="56"/>
      <ellipse cx="580" cy="330" rx="40" ry="56"/>
    </g>
    <text class="s" x="120" y="404" font-size="14" text-anchor="middle">person A</text>
    <text class="s" x="580" y="404" font-size="14" text-anchor="middle">person B</text>

    <!-- labels -->
    <circle cx="86" cy="136" r="15" fill="#26307f"/><text class="n" x="86" y="142" font-size="16" text-anchor="middle">1</text>
    <text class="t" x="110" y="134" font-size="17" font-weight="600">Physical textile surface</text>
    <text class="s" x="306" y="134" font-size="14">woven panel on a small frame loom (real yarn)</text>

  </g>

  <!-- 2. Sensors label -->
  <g>
    <circle cx="190" cy="572" r="15" fill="#26307f"/><text class="n" x="190" y="578" font-size="16" text-anchor="middle">2</text>
    <text class="t" x="214" y="568" font-size="17" font-weight="600">Touch sensors woven into both selvedges</text>
    <text class="s" x="214" y="590" font-size="14">conductive yarn as capacitive touch pads (copper);</text>
    <text class="s" x="214" y="609" font-size="14">optional pressure layer (e.g. piezo-resistive fabric) behind</text>
  </g>

  <!-- Wires from sensors to microcontroller -->
  <path class="wire" d="M120 518 C120 650, 250 700, 318 748"/>
  <path class="wire" d="M580 518 C580 650, 450 700, 382 748"/>
  <path class="wire" d="M132 518 C134 660, 262 712, 330 748" opacity="0.45"/>
  <path class="wire" d="M568 518 C566 660, 438 712, 370 748" opacity="0.45"/>
  <circle cx="120" cy="518" r="4" fill="#a8743f"/><circle cx="132" cy="518" r="4" fill="#a8743f"/>
  <circle cx="580" cy="518" r="4" fill="#a8743f"/><circle cx="568" cy="518" r="4" fill="#a8743f"/>
  <text class="s" x="200" y="690" font-size="13" transform="rotate(32 200 690)">wire, sensor A</text>
  <text class="s" x="452" y="728" font-size="13" transform="rotate(-32 452 728)">wire, sensor B</text>

  <!-- 3. Microcontroller -->
  <g>
    <rect x="250" y="748" width="200" height="104" rx="8" fill="#1f2a6e"/>
    <rect x="270" y="768" width="56" height="44" rx="3" fill="#141418"/>
    <g fill="#d9c9a8"><rect x="340" y="772" width="90" height="5"/><rect x="340" y="784" width="90" height="5"/><rect x="340" y="796" width="70" height="5"/></g>
    <g fill="#d9c9a8">
      <rect x="262" y="842" width="5" height="10"/><rect x="276" y="842" width="5" height="10"/><rect x="290" y="842" width="5" height="10"/>
      <rect x="304" y="842" width="5" height="10"/><rect x="318" y="842" width="5" height="10"/><rect x="332" y="842" width="5" height="10"/>
    </g>
    <text x="350" y="834" font-family="'Atkinson Hyperlegible Next', Arial, sans-serif" font-size="13" fill="#fbfaf8" text-anchor="middle">microcontroller</text>

    <circle cx="486" cy="770" r="15" fill="#26307f"/><text class="n" x="486" y="776" font-size="16" text-anchor="middle">3</text>
    <text class="t" x="510" y="766" font-size="17" font-weight="600">Microcontroller</text>
    <text class="s" x="510" y="788" font-size="14">e.g. ESP32 or Arduino with a capacitive-touch chip;</text>
    <text class="s" x="510" y="807" font-size="14">reads both sensors and decides "A present?", "B present?"</text>
    <text class="s" x="510" y="826" font-size="14">then sends only these two states (no personal data)</text>
  </g>

  <!-- Data link to tablet -->
  <path d="M450 790 C700 790, 800 600, 945 470" fill="none" stroke="#26307f" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <g>
    <rect x="636" y="618" width="268" height="72" rx="6" fill="#fbfaf8" stroke="#26307f" stroke-width="1"/>
    <text class="t" x="770" y="642" font-size="14" font-weight="600" text-anchor="middle">data link: to be decided</text>
    <text class="s" x="770" y="662" font-size="13" text-anchor="middle">USB serial · Bluetooth LE · local Wi-Fi</text>
    <text class="s" x="770" y="680" font-size="13" text-anchor="middle">message: { A: on/off, B: on/off }</text>
  </g>

  <!-- 4. Tablet -->
  <g>
    <rect x="950" y="160" width="330" height="460" rx="26" fill="#141418"/>
    <rect x="968" y="182" width="294" height="416" rx="10" fill="#fbfaf8"/>
    <!-- digital cloth on screen -->
    <rect x="1020" y="196" width="190" height="230" fill="url(#screenweave)"/>
    <rect x="1020" y="196" width="190" height="5" fill="#26307f" opacity="0.85"/>
    <g stroke="#26307f" stroke-width="1" opacity="0.5">
      <line x1="1022" y1="426" x2="1022" y2="584"/><line x1="1030" y1="426" x2="1030" y2="584"/><line x1="1038" y1="426" x2="1038" y2="584"/>
      <line x1="1046" y1="426" x2="1046" y2="584"/><line x1="1054" y1="426" x2="1054" y2="584"/><line x1="1062" y1="426" x2="1062" y2="584"/>
      <line x1="1070" y1="426" x2="1070" y2="584"/><line x1="1078" y1="426" x2="1078" y2="584"/><line x1="1086" y1="426" x2="1086" y2="584"/>
      <line x1="1094" y1="426" x2="1094" y2="584"/><line x1="1102" y1="426" x2="1102" y2="584"/><line x1="1110" y1="426" x2="1110" y2="584"/>
      <line x1="1118" y1="426" x2="1118" y2="584"/><line x1="1126" y1="426" x2="1126" y2="584"/><line x1="1134" y1="426" x2="1134" y2="584"/>
      <line x1="1142" y1="426" x2="1142" y2="584"/><line x1="1150" y1="426" x2="1150" y2="584"/><line x1="1158" y1="426" x2="1158" y2="584"/>
      <line x1="1166" y1="426" x2="1166" y2="584"/><line x1="1174" y1="426" x2="1174" y2="584"/><line x1="1182" y1="426" x2="1182" y2="584"/>
      <line x1="1190" y1="426" x2="1190" y2="584"/><line x1="1198" y1="426" x2="1198" y2="584"/><line x1="1206" y1="426" x2="1206" y2="584"/>
    </g>
    <path d="M1120 420 q8 8 3 22" fill="none" stroke="#b3add8" stroke-width="2" stroke-linecap="round"/>

    <circle cx="1115" cy="652" r="15" fill="#26307f"/><text class="n" x="1115" y="658" font-size="16" text-anchor="middle">4</text>
    <text class="t" x="1115" y="690" font-size="17" font-weight="600" text-anchor="middle">Tablet</text>
    <text class="s" x="1115" y="712" font-size="14" text-anchor="middle">runs the existing web prototype; the two</text>
    <text class="s" x="1115" y="731" font-size="14" text-anchor="middle">touch states replace on-screen touch, and</text>
    <text class="s" x="1115" y="750" font-size="14" text-anchor="middle">the digital cloth grows in response</text>
  </g>

  <!-- Signal flow -->
  <g>
    <text class="t" x="700" y="200" font-size="14" font-weight="600" text-anchor="middle">signal flow</text>
    <g font-family="'Atkinson Hyperlegible Next', Arial, sans-serif" font-size="13" fill="#141418" text-anchor="middle">
      <rect x="650" y="216" width="100" height="30" rx="15" fill="none" stroke="#26307f"/><text x="700" y="236">touch yarn</text>
      <rect x="650" y="270" width="100" height="30" rx="15" fill="none" stroke="#26307f"/><text x="700" y="290">sense</text>
      <rect x="650" y="324" width="100" height="30" rx="15" fill="none" stroke="#26307f"/><text x="700" y="344">both present?</text>
      <rect x="650" y="378" width="100" height="30" rx="15" fill="#26307f"/><text x="700" y="398" fill="#fbfaf8">weave</text>
    </g>
    <g stroke="#26307f" stroke-width="1.4" marker-end="url(#arrow)">
      <line x1="700" y1="246" x2="700" y2="266"/><line x1="700" y1="300" x2="700" y2="320"/><line x1="700" y1="354" x2="700" y2="374"/>
    </g>
  </g>

  <!-- Open questions -->
  <g>
    <line x1="60" y1="880" x2="1340" y2="880" stroke="#26307f" stroke-width="1" opacity="0.35"/>
    <text class="h" x="60" y="912" font-size="20" font-weight="500">Open technical questions to investigate</text>
    <g class="s" font-size="14">
      <text x="60"  y="940">· Sensing: can conductive yarn tell two people from one person using both hands?</text>
      <text x="60"  y="962">· Noise: long wires, humidity and the textile itself may disturb capacitive readings; calibration?</text>
      <text x="60"  y="984">· Latency: is the response fast enough (≈ under 100 ms) to feel like a shared rhythm?</text>
      <text x="720" y="940">· Connection: Web Serial / Web Bluetooth are not available in every tablet browser (e.g. iPad Safari),</text>
      <text x="720" y="962">  and a secure https page cannot talk to a plain local device: which link really works?</text>
      <text x="720" y="984">· Material: durability of conductive yarn, safe low voltage, strain relief; and should the yarn itself respond?</text>
    </g>
  </g>
</svg>
